name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run GAMA-L 2 core tests
        run: python3 -m unittest discover -s gama-lang/v2/tests -v
      - name: Run invoice example
        run: python3 gama-lang/v2/gamal2.py run gama-lang/v2/examples/invoice.gm
