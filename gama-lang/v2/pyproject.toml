[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gama-l"
version = "2.0.0"
description = "GAMA-L 2.0 core language: parser, type/effect checker, interpreter and LSP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
gama-l = "gama_cli:main"
gama-lsp = "gama_lsp:main"
gama-doctor = "gama_doctor:main"
gama-registry = "gama_registry_server:main"
gama-release = "release:main"

[tool.setuptools]
py-modules = ["gamal2", "gama_lsp", "gama_cli", "gama_fmt", "gama_doctor", "gama_mail", "gama_registry", "gama_registry_server", "gama_ai", "gama_ir", "gama_ledger", "release"]
